# Configurações mock para testes - não tenta conectar a uma blockchain real
blockchain.rpc.url=mock:http://localhost:8545
blockchain.contract.address=0x0000000000000000000000000000000000000000
blockchain.wallet.file=dummy-wallet.json
blockchain.wallet.password=dummy

# Desabilita segurança para simplificar os testes
spring.security.user.name=testuser
spring.security.user.password=testpass

# Desativa o health check do blockchain para não causar erro
management.endpoint.health.show-details=never